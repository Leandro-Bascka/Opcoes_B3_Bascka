name: Atualizar opções e publicar

on:
  schedule:
    - cron: "5 13-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opcoes-b3-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Montar pasta do site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest opcore.js opcoes.js opcoes.css site/
      - name: Diagnóstico da API (aparece no log)
        continue-on-error: true
        run: python -u build_options.py --diag PETR4
      - name: Coletar opções
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python -u build_options.py --out site
          --workers 3
          --intervalo 0.6
          --max-min 18
          --top 30
          --wheel-dte 45
          --hv-yahoo
          --prev-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Resumo do resultado por ativo
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = 'site/data/opcoes/meta.json'
          if not os.path.exists(p):
              print('ERRO: meta.json não foi criado; veja o log da etapa Coletar opções.')
              raise SystemExit(0)
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          ativos = d.get('ativos', [])
          falhas = d.get('falhas', [])
          motivos = d.get('falhas_motivo', {})
          stale = [a.get('t') for a in ativos if a.get('stale')]
          fresh = [a.get('t') for a in ativos if not a.get('stale')]
          print(f"Tempo da coleta: {d.get('seconds', '?')} s")
          print(f"Ativos atualizados: {len(fresh)} | de coleta anterior: {len(stale)} | falhas sem dados: {len(falhas)}")
          print('Atualizados:', ', '.join(fresh) or '(nenhum)')
          print('Dados antigos:', ', '.join(stale) or '(nenhum)')
          for t in falhas:
              print(f"FALHA {t}: {motivos.get(t, 'motivo não informado')}")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Resultado da coleta de opções\n\n')
                  f.write(f"- Duração: {d.get('seconds', '?')} s\n- Atualizados: {len(fresh)}\n- Dados anteriores: {len(stale)}\n- Falhas: {len(falhas)}\n\n")
                  for t in falhas:
                      f.write(f"- **{t}**: {motivos.get(t, 'motivo não informado')}\n")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
